# Hero photos. Night photos show in dark mode with the Blue Hour film; day
# photos show in light mode with the smart casual film. Each visit picks one
# at random from its mode's set. Add a photo with `bun run photo <file> hero`.
# These are credited stand-ins from Unsplash until Daniel's own photos are ready.
# The first night photo is also the link preview's background. The browser
# tests expect the first photo of each set, so if that changes, update
# tests/e2e/fixtures.ts to match.

- id: n1
  file: src/assets/hero/n1.jpg
  set: night
  place: Shinjuku, Tokyo
  photographer: Pema G. Lama
  alt: Shinjuku street at night in the rain, lined with lit signs

