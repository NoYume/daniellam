# One entry per trip, newest first (trips in the same month can go in any order).
# `id` is a lowercase slug that doubles as the trip's link, and `month` is YYYY-MM.
# The first photo is the trip's cover and must be landscape.
# Limits: a name is at most 24 characters, a note 70 and a caption 60.
# Exactly four photos in all are `teaser: true`: they fill the homepage's Shots row.
# `credit` goes on anyone else's photo. `mine: true` on a trip, or on a single photo,
# says it's yours and needs no credit (a photo can't say both `mine: true` and `credit`).
# Adding a trip: `bun run photo photos/shots/<trip> shots/<trip>`, paste the `photos:`
# block it prints under a new entry, add its `id`, `name` and `month`, fill in each `alt`.
# These three trips are credited Unsplash stand-ins. Their months and notes are made up.
- id: tokyo
  name: Tokyo
  month: 2026-03
  note: Rain most nights, so the trains and the station lights did the work.
  photos:
    - file: ../assets/hero/n1.jpg
      alt: Shinjuku street at night in the rain, lined with lit signs
      caption: Shinjuku on a rainy night
      credit: Pema G. Lama
    - file: ../assets/shots/u6-p.jpg
      alt: Looking up at Tokyo towers
      caption: Looking up between the towers
      credit: Shunya Koide
    - file: ../assets/shots/n11.jpg
      alt: Rainy alley in Shinjuku
      caption: An alley in Shinjuku, in the rain
      credit: Intrepid (@intrepidfilm)
    - file: ../assets/shots/n12.jpg
      alt: Station platform at dusk
      caption: Ochanomizu Station at dusk
      credit: taro ohtani
      teaser: true
    - file: ../assets/shots/u7-p.jpg
      alt: A quiet Tokyo side street with power lines and brick houses
      caption: A quiet street
      credit: Emil Karlsson
      teaser: true
    - file: ../assets/hero/u13.jpg
      alt: An overcast residential street in Tokyo
      caption: A residential street on an overcast day
      credit: Tsuyoshi Kozu
